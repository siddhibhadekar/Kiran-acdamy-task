<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login | CareerBridge Placement Portal</title><link rel="stylesheet" href="css/style.css"></head>
<body><div class="login-wrap"><form class="login-card" onsubmit="return false">
<img src="images/logo.svg" alt="Logo"><h1>CareerBridge Placement Portal</h1><p class="sub">Kiran Academy</p>
<div class="msg bad">Username or password is incorrect. (example message)</div>
<div class="field"><label>Username / Email <span class="req">*</span></label><input type="text" value="recruiter@demo.com"></div>
<div class="field"><label>Password <span class="req">*</span></label><input type="password" value="password123"><div class="help">Password is masked.</div></div>
<div class="field"><label>Role <span class="req">*</span></label><select><option>Admin</option><option selected>Recruiter</option><option>Placement Officer</option></select></div>
<div class="actions"><a class="btn" href="dashboard.html">Login</a><a class="btn sec" href="login.html">Reset</a></div>
<p class="center"><a href="login.html">Forgot Password?</a></p>
<p class="center help">Authorized users only.</p></form></div></body></html>
